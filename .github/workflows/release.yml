name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      chuks_version:
        description: "chuks CLI version used to BUILD & PUBLISH (e.g. v0.1.0 or 'latest'). This is the compiler version — NOT the package version."
        required: false
        type: string
        default: "v0.1.0"
      build_windows:
        description: "Also attempt the experimental windows-x86_64 prebuilt (FFmpeg-from-source on Windows is unresolved; non-blocking)."
        required: false
        type: boolean
        default: false

jobs:
  # ── Resolve the chuks CLI (compiler) version — single source of truth ──────
  # IMPORTANT: this is the COMPILER version, completely independent of the
  # package tag / chuks.json version. While chuks is in pre-release we pin
  # v0.1.0; switch this to "latest" once a stable chuks release ships.
  setup:
    name: Resolve chuks CLI version
    runs-on: ubuntu-22.04
    outputs:
      chuks_version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ github.event.inputs.chuks_version }}"
          if [[ -z "$VER" ]]; then
            VER="v0.1.0" # default for tag-triggered runs (pre-release pin)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "chuks CLI version: $VER"

  publish-source:
    name: Publish source tarball
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all remote branches. `chuks publish` verifies the
          # tagged commit is on a remote branch via `git branch -r --contains`,
          # which is empty in the default shallow detached-HEAD tag checkout.
          fetch-depth: 0

      - name: Install chuks CLI
        shell: bash
        env:
          CHUKS_VERSION: ${{ needs.setup.outputs.chuks_version }}
        run: |
          set -euo pipefail
          BASE="chuks-linux-amd64"
          REPO="chuks-programming-language/releases"
          if [[ "$CHUKS_VERSION" == "latest" ]]; then
            URL="https://github.com/$REPO/releases/latest/download/${BASE}.tar.gz"
          else
            URL="https://github.com/$REPO/releases/download/${CHUKS_VERSION}/${BASE}.tar.gz"
          fi
          curl -fsSL "$URL" | tar -xz -C /tmp
          mkdir -p "$HOME/chuks/bin"
          if [[ -d "/tmp/${BASE}" ]]; then
            mv "/tmp/${BASE}/chuks" "$HOME/chuks/bin/chuks"
          else
            mv /tmp/chuks "$HOME/chuks/bin/chuks"
          fi
          chmod +x "$HOME/chuks/bin/chuks"
          echo "$HOME/chuks/bin" >> "$GITHUB_PATH"
          "$HOME/chuks/bin/chuks" --version || true

      # PACKAGE version check: the git tag (e.g. v1.0.0) must equal chuks.json
      # `version` (1.0.0). This is the package version — unrelated to the
      # chuks CLI version resolved above.
      - name: Verify chuks.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(jq -r .version chuks.json)
          if [[ "$TAG" != "$PKG_VER" ]]; then
            echo "::error::tag v$TAG does not match chuks.json version $PKG_VER" >&2
            exit 1
          fi

      - name: Publish source
        shell: bash
        env:
          CHUKS_TOKEN: ${{ secrets.CHUKS_TOKEN }}
        run: |
          set -euo pipefail
          # If the version already exists in the registry, exit 0 — prebuilt
          # jobs can still proceed.
          if chuks publish 2>&1 | tee /tmp/pub.log; then
            echo "Source published."
          else
            if grep -qi "already exists\|409" /tmp/pub.log; then
              echo "Source version already published — continuing to prebuilts."
            else
              cat /tmp/pub.log
              exit 1
            fi
          fi

  # NOTE: we do NOT use the generic shim-publish-action reusable workflow here.
  # It runs `cargo build` with no system-dependency step, but @chuks/ffmpeg
  # compiles FFmpeg from source (the `build` feature), which needs `nasm` (x86
  # assembly), `clang`/`libclang` (rust-bindgen) and `pkg-config`. Without nasm
  # the x86 targets fail configure ("nasm not found") in ~40s. So we run our own
  # matrix that installs those deps first, then publishes with the same command
  # the action uses: `chuks publish --prebuilt-only --platform <p> --file <so>`.
  # windows-x86_64 is handled by the separate `publish-prebuilt-windows` job
  # below (it needs a different, MSYS2/MinGW, toolchain).
  publish-prebuilts:
    name: prebuilt ${{ matrix.platform }}
    needs: [setup, publish-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64,  runner: macos-14,         target: aarch64-apple-darwin }
          - { platform: darwin-x86_64, runner: macos-13,         target: x86_64-apple-darwin }
          - { platform: linux-x86_64,  runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg build deps (nasm, clang, pkg-config)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends nasm yasm pkg-config clang libclang-dev
              ;;
            macOS)
              brew install nasm pkg-config >/dev/null || brew list nasm >/dev/null
              ;;
          esac
          nasm --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shim/target
          key: shim-${{ matrix.platform }}-${{ hashFiles('shim/Cargo.lock', 'shim/Cargo.toml') }}
          restore-keys: |
            shim-${{ matrix.platform }}-

      - name: Build shim (FFmpeg from source, static)
        shell: bash
        run: cargo build --release --manifest-path shim/Cargo.toml --target ${{ matrix.target }}

      - name: Locate produced cdylib
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          DIR="shim/target/${{ matrix.target }}/release"
          case "${{ matrix.platform }}" in
            darwin-*)  EXT="dylib" ;;
            linux-*)   EXT="so" ;;
          esac
          FILE=$(find "$DIR" -maxdepth 1 -type f -name "*.$EXT" ! -name "*.d.$EXT" | head -n 1)
          if [[ -z "$FILE" ]]; then
            echo "::error::No .$EXT found in $DIR" >&2; ls -la "$DIR" || true; exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Built: $FILE"

      - name: Sign macOS dylib
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          xattr -cr "${{ steps.locate.outputs.file }}"
          codesign --force --sign - "${{ steps.locate.outputs.file }}"

      - name: Install chuks CLI
        shell: bash
        env:
          CHUKS_VERSION: ${{ needs.setup.outputs.chuks_version }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            darwin-arm64)   BASE="chuks-darwin-arm64" ;;
            darwin-x86_64)  BASE="chuks-darwin-amd64" ;;
            linux-x86_64)   BASE="chuks-linux-amd64" ;;
            linux-aarch64)  BASE="chuks-linux-arm64" ;;
          esac
          REPO="chuks-programming-language/releases"
          if [[ "$CHUKS_VERSION" == "latest" ]]; then
            URL="https://github.com/$REPO/releases/latest/download/${BASE}.tar.gz"
          else
            URL="https://github.com/$REPO/releases/download/${CHUKS_VERSION}/${BASE}.tar.gz"
          fi
          mkdir -p "$HOME/chuks/bin"
          curl -fsSL "$URL" | tar -xz -C /tmp
          if [[ -d "/tmp/${BASE}" ]]; then
            cp "/tmp/${BASE}/chuks" "$HOME/chuks/bin/chuks"
          else
            cp /tmp/chuks "$HOME/chuks/bin/chuks"
          fi
          chmod +x "$HOME/chuks/bin/chuks"
          echo "$HOME/chuks/bin" >> "$GITHUB_PATH"
          "$HOME/chuks/bin/chuks" --version || true

      - name: Publish prebuilt
        shell: bash
        env:
          CHUKS_TOKEN: ${{ secrets.CHUKS_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run over an already-published prebuilt is a no-op.
          if chuks publish --prebuilt-only \
               --platform "${{ matrix.platform }}" \
               --file "${{ steps.locate.outputs.file }}" 2>&1 | tee /tmp/pub.log; then
            echo "Published ${{ matrix.platform }}."
          elif grep -qi "already exists\|409" /tmp/pub.log; then
            echo "Prebuilt for ${{ matrix.platform }} already published — ok."
          else
            cat /tmp/pub.log; exit 1
          fi

  # windows-x86_64 prebuilt via the MSVC toolchain. ffmpeg-sys-next builds FFmpeg
  # by running `sh configure --toolchain=msvc` (so it uses cl.exe, not gcc) and
  # does NOT force --enable-pthreads on MSVC — which sidesteps the MinGW gcc-16 /
  # pthreads dead-end. Requirements: cl.exe (msvc-dev-cmd), `sh` + coreutils that
  # configure calls (Git's usr/bin), nasm (x86 asm), and libclang (rust-bindgen).
  # PATH-ORDER TRAP: Git's usr/bin ships a `link.exe` (coreutils) that shadows
  # MSVC's linker. We add Git's tools BEFORE msvc-dev-cmd so MSVC's cl.exe/link.exe
  # end up first on PATH. Experimental, gated behind build_windows, non-blocking.
  publish-prebuilt-windows:
    name: prebuilt windows-x86_64 (experimental)
    needs: [setup, publish-source]
    if: ${{ github.event.inputs.build_windows == 'true' }}
    continue-on-error: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Add Git's Unix tools (sh, grep, sed, awk, ...) that FFmpeg's configure
      # needs. Done BEFORE msvc-dev-cmd so MSVC's link.exe outranks Git's.
      - name: Add Git Unix tools to PATH
        shell: pwsh
        run: echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Set up MSVC (cl.exe) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install nasm + point bindgen at libclang
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm --no-progress -y
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build shim (FFmpeg from source, MSVC toolchain)
        shell: bash
        run: |
          set -uo pipefail
          echo "cl:   $(which cl.exe || true)"
          echo "link: $(which link.exe || true)   (must be the MSVC linker, not Git's)"
          echo "sh:   $(which sh || true)"
          echo "nasm: $(which nasm || true)"
          if ! cargo build --release --manifest-path shim/Cargo.toml --target x86_64-pc-windows-msvc; then
            echo "===== build failed — dumping FFmpeg config.log tail ====="
            find shim/target -name config.log -path "*ffmpeg*" 2>/dev/null | while read -r f; do
              echo "----- $f -----"; tail -n 80 "$f"
            done
            exit 1
          fi

      - name: Locate produced DLL
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          DIR="shim/target/x86_64-pc-windows-msvc/release"
          FILE=$(find "$DIR" -maxdepth 1 -type f -name "*.dll" ! -name "*.d.dll" | head -n 1)
          if [[ -z "$FILE" ]]; then
            echo "::error::No .dll found in $DIR" >&2; ls -la "$DIR" || true; exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Built: $FILE"

      - name: Install chuks CLI
        shell: bash
        env:
          CHUKS_VERSION: ${{ needs.setup.outputs.chuks_version }}
        run: |
          set -euo pipefail
          BASE="chuks-windows-amd64"
          REPO="chuks-programming-language/releases"
          if [[ "$CHUKS_VERSION" == "latest" ]]; then
            URL="https://github.com/$REPO/releases/latest/download/${BASE}.zip"
          else
            URL="https://github.com/$REPO/releases/download/${CHUKS_VERSION}/${BASE}.zip"
          fi
          curl -fsSL -o /tmp/chuks.zip "$URL"
          mkdir -p /tmp/chuks-extract "$HOME/chuks/bin"
          unzip -o /tmp/chuks.zip -d /tmp/chuks-extract
          cp /tmp/chuks-extract/"$BASE"/chuks* "$HOME/chuks/bin/" 2>/dev/null \
            || cp /tmp/chuks-extract/chuks* "$HOME/chuks/bin/"
          echo "$HOME/chuks/bin" >> "$GITHUB_PATH"
          "$HOME/chuks/bin/chuks.exe" --version || true

      - name: Publish prebuilt
        shell: bash
        env:
          CHUKS_TOKEN: ${{ secrets.CHUKS_TOKEN }}
        run: |
          set -euo pipefail
          CHUKS="$HOME/chuks/bin/chuks.exe"
          if "$CHUKS" publish --prebuilt-only --platform windows-x86_64 \
               --file "${{ steps.locate.outputs.file }}" 2>&1 | tee /tmp/pub.log; then
            echo "Published windows-x86_64."
          elif grep -qi "already exists\|409" /tmp/pub.log; then
            echo "Prebuilt for windows-x86_64 already published — ok."
          else
            cat /tmp/pub.log; exit 1
          fi
